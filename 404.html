<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>404 — Page not found · Jason Kaufman</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

    <!-- First-paint canvas matches the theme before stylesheets load (D-06/D-14). -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html {
        background-color: Canvas;
      }
      body {
        margin: 0;
        background-color: Canvas;
        color: CanvasText;
      }
    </style>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <style>
      .error-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: var(--container-pad);
      }
      .error-page__code {
        font-size: var(--text-6xl);
        font-weight: var(--weight-display);
        line-height: var(--leading-tight);
        color: var(--color-accent);
      }
      .error-page__text {
        margin-block: var(--space-sm) var(--space-lg);
        max-width: 42ch;
        margin-inline: auto;
        color: var(--color-text-muted);
      }
    </style>
  </head>

  <body>
    <main class="error-page">
      <div>
        <p class="error-page__code">404</p>
        <h1>Page not found</h1>
        <p class="error-page__text">
          The page you're looking for doesn't exist or has moved.
        </p>
        <a class="button button--primary" href="/">Back to home</a>
      </div>
    </main>
  </body>
</html>
