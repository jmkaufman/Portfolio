<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Critical CSS (D-06) + no-flash theme bootstrap (D-14). Painted before the
      external stylesheets load: color-scheme + the system colors Canvas/CanvasText
      theme the first paint to the resolved theme without duplicating token values.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      html {
        background-color: Canvas;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: Canvas;
        color: CanvasText;
      }
    </style>
    <script>
      // Theme bootstrap (D-14): apply the stored preference before first paint to
      // avoid a flash of the wrong theme. With no stored preference the OS setting
      // is followed via color-scheme: light dark. Also flips the no-js → js hook so
      // JS-only controls (e.g. the theme toggle) are hidden when JS is unavailable
      // (graceful degradation, D-05/D-30). Hashed in the meta CSP (D-20/D-31).
      (function () {
        var root = document.documentElement;
        root.classList.remove("no-js");
        root.classList.add("js");
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            root.setAttribute("data-theme", stored);
            root.style.colorScheme = stored;
          }
        } catch (e) {
          /* localStorage unavailable — fall back to OS preference */
        }
      })();
    </script>

    <title>Jason Kaufman — Software Engineer</title>
    <meta
      name="description"
      content="Jason Kaufman is a software engineer with a background in real-time systems, branching into full-stack. Experience, projects, and contact."
    />
    <link rel="canonical" href="https://jasonkaufman.dev/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
